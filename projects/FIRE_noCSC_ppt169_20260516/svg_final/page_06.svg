<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF" />
  <text x="60" y="52" font-family="Segoe UI, system-ui, sans-serif" font-size="28" font-weight="700" fill="#0C4A6E">Working Hypothesis</text>
  <line x1="60" y1="68" x2="140" y2="68" stroke="#7DD3FC" stroke-width="3" />

  
  <path fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1" d="M72,100 H1208 A12,12 0 0 1 1220,112 V178 A12,12 0 0 1 1208,190 H72 A12,12 0 0 1 60,178 V112 A12,12 0 0 1 72,100 Z" />
  <text x="640" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="600" fill="#0C4A6E">Sensorimotor learning strengthens correlated activity between PMC neurons encoding movement and</text>
  <text x="640" y="164" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="600" fill="#0C4A6E">A1 neurons encoding acoustic frequency — establishing a learned forward model in the A1-PMC circuit.</text>

  
  <path fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" d="M72,220 H658 A12,12 0 0 1 670,232 V558 A12,12 0 0 1 658,570 H72 A12,12 0 0 1 60,558 V232 A12,12 0 0 1 72,220 Z" />
  <text x="88" y="252" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0369A1">Circuit-Level Mechanism</text>

  <circle cx="100" cy="290" r="11" fill="#0369A1" />
  <text x="100" y="295" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">1</text>
  <text x="122" y="296" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1A1A2E">PMC → A1 projections carry corollary discharge</text>

  <circle cx="100" cy="328" r="11" fill="#0369A1" />
  <text x="100" y="333" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">2</text>
  <text x="122" y="334" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1A1A2E">Closed-loop experience potentiates PMC-A1 synapses</text>
  <text x="134" y="354" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748B">encoding the specific position → frequency mapping</text>

  <circle cx="100" cy="388" r="11" fill="#0369A1" />
  <text x="100" y="393" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">3</text>
  <text x="122" y="394" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1A1A2E">Motor command → PMC → A1 pre-activates frequency-tuned</text>
  <text x="134" y="414" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748B">neurons BEFORE sound onset (= the anticipatory signal)</text>

  <circle cx="100" cy="448" r="11" fill="#0369A1" />
  <text x="100" y="453" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">4</text>
  <text x="122" y="454" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1A1A2E">Prediction error (actual − predicted) drives ongoing plasticity</text>

  <circle cx="100" cy="498" r="11" fill="#0369A1" />
  <text x="100" y="503" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">5</text>
  <text x="122" y="504" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1A1A2E">Multiple mappings → distinct synaptic patterns, context-retrievable</text>

  
  <path fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="8,4" d="M718,220 H1212 A8,8 0 0 1 1220,228 V562 A8,8 0 0 1 1212,570 H718 A8,8 0 0 1 710,562 V228 A8,8 0 0 1 718,220 Z" />
  <text x="965" y="330" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-style="italic" fill="#94A3B8">[Figure: A1-PMC Circuit Schematic]</text>
  <text x="965" y="355" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-style="italic" fill="#94A3B8">Motor Command → PMC → Corollary Discharge</text>
  <text x="965" y="378" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-style="italic" fill="#94A3B8">→ A1 Frequency Prediction</text>
  <text x="965" y="401" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-style="italic" fill="#94A3B8">→ Compare with Auditory Feedback</text>
  <text x="965" y="424" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-style="italic" fill="#94A3B8">→ Prediction Error → Plasticity</text>

  
  <path fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" d="M68,600 H1212 A8,8 0 0 1 1220,608 V657 A8,8 0 0 1 1212,665 H68 A8,8 0 0 1 60,657 V608 A8,8 0 0 1 68,600 Z" />
  <text x="640" y="628" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#64748B">Testable Predictions: (1) Signal specific to learned mappings | (2) PMC inactivation abolishes the signal</text>
  <text x="640" y="648" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#64748B">(3) Remapping → old predictions fade, new emerge | (4) Latent representations coexist in A1-PMC space</text>

  <text x="1220" y="700" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#94A3B8">6</text>
</svg>