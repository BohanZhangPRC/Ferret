<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF" />
  <text x="60" y="52" font-family="Segoe UI, system-ui, sans-serif" font-size="28" font-weight="700" fill="#0C4A6E">Why FIRE &amp; Learning Planet Institute</text>
  <line x1="60" y1="68" x2="140" y2="68" stroke="#7DD3FC" stroke-width="3" />

  
  <path fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1" d="M72,100 H678 A12,12 0 0 1 690,112 V508 A12,12 0 0 1 678,520 H72 A12,12 0 0 1 60,508 V112 A12,12 0 0 1 72,100 Z" />
  <text x="88" y="135" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0C4A6E">Three Reasons — FIRE over a Standard Doctoral School</text>

  <circle cx="88" cy="180" r="13" fill="#0369A1" />
  <text x="88" y="185" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">1</text>
  <text x="115" y="184" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0369A1">Scientific Interdisciplinarity</text>
  <text x="115" y="206" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1A1A2E">This project sits at the intersection of experimental systems neuroscience, computational</text>
  <text x="115" y="226" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1A1A2E">population analysis, and cognitive science — mapping onto FIRE's interdisciplinary mission</text>

  <circle cx="88" cy="275" r="13" fill="#0369A1" />
  <text x="88" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">2</text>
  <text x="115" y="279" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0369A1">Methodological Innovation</text>
  <text x="115" y="301" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1A1A2E">Combines chronic e-phys, closed-loop VR, and computational population analyses — bridging</text>
  <text x="115" y="321" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1A1A2E">experimental and theoretical domains in ways unusual for a standard doctoral school</text>

  <circle cx="88" cy="370" r="13" fill="#0369A1" />
  <text x="88" y="375" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">3</text>
  <text x="115" y="374" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0369A1">Long-Term Responsible Framing</text>
  <text x="115" y="396" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1A1A2E">FIRE requires explicit attention to downstream ethical &amp; societal implications. CIRP workshops</text>
  <text x="115" y="416" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1A1A2E">+ philosophy of science provide space to revisit planetary implications at key milestones</text>

  <text x="88" y="470" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0C4A6E">Why Learning Planet Institute</text>
  <text x="88" y="496" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1A1A2E">Planetary-scale thinking applied to learning &amp; cognition — a unique intellectual home for</text>
  <text x="88" y="516" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1A1A2E">research that refuses disciplinary silos. A community committed to science in service of humanity</text>

  
  <path fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" d="M732,100 H1208 A12,12 0 0 1 1220,112 V368 A12,12 0 0 1 1208,380 H732 A12,12 0 0 1 720,368 V112 A12,12 0 0 1 732,100 Z" />
  <text x="748" y="135" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0369A1">Why I Am Ready Now</text>
  <text x="748" y="168" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1A1A2E">Already operating the closed-loop paradigm</text>
  <text x="748" y="190" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#64748B">→ zero ramp-up time, productivity from Day 1</text>
  <text x="748" y="220" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1A1A2E">Fully trained in lab's analysis pipelines</text>
  <text x="748" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#64748B">PCA · GPFA · Granger causality · population decoding</text>
  <text x="748" y="272" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1A1A2E">Seamless M2 → PhD transition</text>
  <text x="748" y="294" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#64748B">→ immediate scientific productivity guaranteed</text>
  <text x="748" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1A1A2E">Unique hybrid profile</text>
  <text x="748" y="346" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748B">In vivo e-phys + ML + computation — OHBM 2025</text>
  <text x="748" y="368" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748B">4 validated animals, 7 hemispheres — publishable data from Month 1</text>

  <path fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1" d="M732,400 H1208 A12,12 0 0 1 1220,412 V508 A12,12 0 0 1 1208,520 H732 A12,12 0 0 1 720,508 V412 A12,12 0 0 1 732,400 Z" />
  <text x="748" y="432" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0369A1">Unique Profile &amp; Autonomy</text>
  <text x="748" y="460" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1A1A2E">Progressive autonomy: close guidance Year 1 → independent leadership Year 3–4</text>
  <text x="748" y="486" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1A1A2E">Weekly one-to-one supervision throughout (per Boubenec supervision plan)</text>

  <text x="1220" y="700" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#94A3B8">10</text>
</svg>