<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="60" y="52" font-family="Segoe UI, system-ui, sans-serif" font-size="28" font-weight="700" fill="#0C4A6E">Preliminary Data</text>
  <text x="60" y="78" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#64748B">The Closed-Loop Frequency-Tracking Paradigm</text>
  <line x1="60" y1="95" x2="140" y2="95" stroke="#7DD3FC" stroke-width="3"/>

  <!-- Left: Description -->
  <rect x="60" y="120" width="520" height="280" rx="12" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1"/>
  <text x="88" y="152" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0C4A6E">Experimental Setup</text>
  <text x="88" y="182" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1A1A2E">Real-time: snout position → acoustic frequency</text>
  <text x="88" y="206" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748B">in head-fixed, freely moving ferrets</text>
  <text x="88" y="238" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1A1A2E">Interleaved: Closed-Loop (Tracking) vs. Open-Loop Playback</text>
  <text x="88" y="260" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748B">Identical acoustics — different contingency</text>
  <text x="88" y="292" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1A1A2E">32-channel tungsten floating arrays</text>
  <text x="88" y="316" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748B">Chronically implanted in A1 — same units over months</text>
  <text x="88" y="356" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0369A1">First platform for single-neuron auditory-motor</text>
  <text x="88" y="378" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0369A1">learning across the naïve → expert trajectory</text>

  <!-- Right: Figure placeholder -->
  <rect x="620" y="120" width="600" height="565" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="920" y="250" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-style="italic" fill="#94A3B8">[Figure 1 — 6 panels from PhD proposal]</text>
  <text x="920" y="280" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-style="italic" fill="#94A3B8">(A) Closed-loop paradigm: snout position → acoustic frequency</text>
  <text x="920" y="305" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-style="italic" fill="#94A3B8">(B) Representative trial: head position + played frequency</text>
  <text x="920" y="330" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-style="italic" fill="#94A3B8">(C) PSTH aligned to movement onset</text>
  <text x="920" y="355" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-style="italic" fill="#94A3B8">(D) A1 firing rate stratified by head speed quintiles</text>
  <text x="920" y="380" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-style="italic" fill="#94A3B8">(E) Population decoding accuracy: CL > OL (p &lt; 0.001)</text>
  <text x="920" y="405" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-style="italic" fill="#94A3B8">(F) Noise correlations A1-PMC: CL > OL, increases with learning</text>

  <text x="1220" y="700" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#94A3B8">4</text>
</svg>