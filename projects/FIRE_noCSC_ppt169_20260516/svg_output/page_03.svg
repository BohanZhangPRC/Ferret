<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="60" y="52" font-family="Segoe UI, system-ui, sans-serif" font-size="28" font-weight="700" fill="#0C4A6E">The Problem: Auditory-Motor Coupling</text>
  <line x1="60" y1="68" x2="140" y2="68" stroke="#7DD3FC" stroke-width="3"/>

  <!-- Left: Core concepts -->
  <rect x="60" y="100" width="560" height="280" rx="12" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1"/>
  <text x="88" y="132" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0C4A6E">Core Question</text>
  <text x="88" y="156" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1A1A2E">How does the brain learn to predict and produce sounds?</text>

  <text x="88" y="196" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0369A1">Two Fundamental Computations (Kawato, 1999)</text>
  <circle cx="100" cy="222" r="11" fill="#0369A1"/>
  <text x="100" y="227" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">1</text>
  <text x="120" y="228" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1A1A2E">Forward Problem — Predict sensory consequences of actions</text>
  <circle cx="100" cy="252" r="11" fill="#0369A1"/>
  <text x="100" y="257" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">2</text>
  <text x="120" y="258" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1A1A2E">Inverse Problem — Convert sensory goals into motor commands</text>

  <text x="88" y="298" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0369A1">Theoretical Backbone: Corollary Discharge</text>
  <text x="88" y="322" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1A1A2E">Motor command copy broadcast to sensory cortex before movement</text>
  <text x="88" y="346" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#64748B">Schneider et al. (2018) Nature — mouse A1 develops a learned filter</text>

  <!-- Right: Figure placeholder -->
  <rect x="660" y="100" width="560" height="280" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="940" y="235" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-style="italic" fill="#94A3B8">[Figure: Forward &amp; Inverse Model Schematic]</text>
  <text x="940" y="258" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-style="italic" fill="#94A3B8">Kawato 1999 framework applied to auditory domain</text>

  <!-- Bottom: Three questions -->
  <rect x="60" y="410" width="560" height="275" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="88" y="442" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0C4A6E">Three Unresolved Questions</text>

  <text x="88" y="480" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0369A1">Q1 · Cortical Hierarchy</text>
  <text x="88" y="502" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1A1A2E">Are predictions generated in A1 or inherited from higher auditory areas?</text>

  <text x="88" y="540" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0369A1">Q2 · Multiple Mappings</text>
  <text x="88" y="562" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1A1A2E">How does the brain store and switch between distinct sensorimotor mappings?</text>

  <text x="88" y="600" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0369A1">Q3 · Inverse Computation</text>
  <text x="88" y="622" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1A1A2E">How are auditory targets converted into motor commands during production?</text>

  <!-- Right bottom: Ferret -->
  <rect x="660" y="410" width="560" height="275" rx="12" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1"/>
  <text x="688" y="442" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0C4A6E">Why Ferret?</text>
  <text x="688" y="475" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1A1A2E">Gyrencephalic carnivore with well-characterized auditory hierarchy</text>
  <text x="688" y="502" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1A1A2E">Accessible premotor cortex for chronic multi-electrode recording</text>
  <text x="688" y="529" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1A1A2E">Robust cortical plasticity during auditory task learning</text>
  <text x="688" y="570" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0369A1">First platform for single-neuron auditory-motor learning</text>
  <text x="688" y="596" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0369A1">across the naïve → expert trajectory</text>

  <text x="1220" y="700" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#94A3B8">3</text>
</svg>