function getUserTypes(user){
  const scores = {
    "动员型": user.emotion + user.mobilization,

    "技术型": user.logic + user.order,
    "发展型": user.development + user.order,
    "意识形态型": user.ideology + user.mobilization
  };
  return Object.entries(scores)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,2)
    .map(x=>x[0]);
}

};

function canonicalizeType(type){ return typeAliasMap[type] || type; }
function matchesUserTypes(leader, userTypes){

function determineQuadrant(){
  const q1 = quadrantState["quad_q1"]; const q2 = quadrantState["quad_q2"]; const q3 = quadrantState["quad_q3"];
  let axis1Votes = {democratic:0, authoritarian:0}; let axis2Votes = {open:0, institutional:0};
  if(q1 !== null) Object.entries(quadrantQuestions[0].options[q1].axis || {}).forEach(([k,v])=>{ if(k in axis1Votes) axis1Votes[k] += v; });
  if(q2 !== null) Object.entries(quadrantQuestions[1].options[q2].axis || {}).forEach(([k,v])=>{ if(k in axis2Votes) axis2Votes[k] += v; });
  if(q3 !== null) Object.entries(quadrantQuestions[2].options[q3].axis || {}).forEach(([k,v])=>{ if(k in axis1Votes) axis1Votes[k] += v; if(k in axis2Votes) axis2Votes[k] += v; });
  const q1Fallback = q1 === 0 ? "authoritarian" : "democratic"; const q2Fallback = q2 === 0 ? "open" : "institutional";
  const axis1 = axis1Votes.authoritarian === axis1Votes.democratic ? q1Fallback : (axis1Votes.authoritarian > axis1Votes.democratic ? "authoritarian" : "democratic");
  const axis2 = axis2Votes.open === axis2Votes.institutional ? q2Fallback : (axis2Votes.open > axis2Votes.institutional ? "open" : "institutional");
  return `${axis1}_${axis2}`;

function autoAdvanceIfSimple(q){
  if(!["binary","single","policy","likert"].includes(q.type)) return;
  setTimeout(()=>{
    if(phase === "quadrant"){
      if(currentIndex < quadrantQuestions.length-1){ currentIndex += 1; renderCurrentQuestion(); }
      else{ lockedQuadrant = determineQuadrant(); phase = "main"; currentIndex = 0; renderCurrentQuestion(); }

      if(currentIndex < questions.length-1){ currentIndex += 1; renderCurrentQuestion(); }

function zeroVector(){ const v = {}; dims.forEach(d=>v[d]=0); return v; }
function addScore(target, scoreObj, weight=1){ Object.entries(scoreObj || {}).forEach(([k,v])=>{ target[k] += v * weight; }); }
function normalizeUser(v){ const out = {}; dims.forEach(d=>{ const shifted = 5 + v[d] / 3.2; out[d] = Math.max(0, Math.min(10, shifted)); }); return out; }

function analyzeRanking(ans){
  const top3 = ans.slice(0,3);
  return { primary: ans[0], secondary: ans[1], tertiary: ans[2], top2: ans.slice(0,2), top3, securityFirst: ans[0] === "国家安全", developmentFirst: ans[0] === "经济发展", innovationFirst: ans[0] === "科技创新", industryFirst: ans[0] === "工业基础", cultureFirst: ans[0] === "文化认同", faithFirst: ans[0] === "信仰体系", developmentHeavy: top3.includes("经济发展") || top3.includes("工业基础") || top3.includes("科技创新"), cultureHeavy: top3.includes("文化认同") || top3.includes("信仰体系") };
}

function buildUserVector(){
  const user = zeroVector(); const meta = {topRanking: [], developmentBias: 0, securityBias: 0, rankingProfile: null};
  questions.forEach(q=>{
    const ans = state[q.id];
    if(["binary","single","policy"].includes(q.type) && ans !== null){
      addScore(user, q.options[ans].score, q.weight);
      if(["q12","q13","q14"].includes(q.id)){
        if((q.id === "q12" && ans === 2) || (q.id === "q13" && ans === 2) || (q.id === "q14" && (ans === 2 || ans === 3))) meta.developmentBias += 2;
        if((q.id === "q12" && ans === 3) || (q.id === "q14" && ans === 1)) meta.securityBias += 2;
      }
    }
    if(q.type === "multi"){
      if(ans[0] !== undefined) addScore(user, q.options[ans[0]].score, q.mainWeight);
      if(ans[1] !== undefined) addScore(user, q.options[ans[1]].score, q.secondWeight);
    }
    if(q.type === "likert" && ans !== null){
      if(q.dim){ const scale = [-2,-1,0,1,2][ans]; const obj = {}; obj[q.dim] = scale; addScore(user, obj, q.weight); }
      else{ addScore(user, q.scores[ans], q.weight); }
    }
    if(q.type === "ranking"){
      meta.topRanking = ans.slice(0,2); meta.rankingProfile = analyzeRanking(ans);
      if(meta.topRanking.includes("经济发展")) meta.developmentBias += 2;
      if(meta.topRanking.includes("科技创新")) meta.developmentBias += 3;
      if(meta.topRanking.includes("工业基础")) meta.developmentBias += 2;
      if(meta.topRanking.includes("国家安全")) meta.securityBias += 2;
    }
  });
  return { user: normalizeUser(user), meta };
}

function distinctiveness(v){ return dims.reduce((acc,k)=>acc + Math.abs(v[k]-5), 0); }
function weightedDistance(user, leader){ let sum = 0; dims.forEach(k=>{ const w = leader.weight[k] || 1; sum += w * Math.pow(user[k] - leader.vec[k], 2); }); return Math.sqrt(sum); }
function centerPenalty(leader){ const dist = distinctiveness(leader.vec); return dist < 14 ? (14 - dist) * 0.25 : 0; }
function extremenessPenalty(leader){ let penalty = 0; if(leader.vec.power >= 9 && leader.vec.force >= 9) penalty += 0; return penalty; }

function profileAdjustment(user, leader){

  if(n === "特朗普"){ if(user.conflict >= 7.5 && user.emotion >= 7.5 && user.logic <= 5.5 && user.order <= 5.5) return -1.2; }
  if(n === "丘吉尔"){
    if(user.conflict >= 7.2 && user.force >= 6.6 && user.mobilization >= 6.0 && user.development <= 6.2) return -1.0;
    if(user.conflict >= 6.6 && user.force >= 6.0) return -0.4;
  }
  if(n === "肯尼迪"){
    if(user.emotion >= 7.2 && user.mobilization >= 7.0 && user.conflict <= 6.8 && user.force <= 5.8) return -1.1;
    if(user.emotion >= 6.8 && user.mobilization >= 6.4 && user.conflict <= 7.2) return -0.5;
  }
  if(n === "罗斯福"){
    if(user.development >= 7.2 && user.order >= 6.0 && (user.emotion >= 6.0 || user.mobilization >= 6.0) && user.conflict <= 6.4) return -1.4;
    if(user.development >= 6.8 && user.order >= 5.8) return -0.6;

  const unlockDims = getUnlockDims(leader); if(!unlockDims || unlockDims.length === 0) return true;

function applyUnlockWindow(user, candidates){
  if(!candidates || candidates.length <= 2) return {candidates, tolerance:null};
  const tolerances = [0, 0.5, 1, 1.5, 2];
  for(const tolerance of tolerances){ const unlocked = candidates.filter(x => passesUnlock(user, x.leader, tolerance)); if(unlocked.length >= 2) return {candidates: unlocked, tolerance}; }

  if(baseCandidates.length < 3){
    const relaxedTypeSameVeto = leaders.filter(l => l.quadrant === lockedQuadrant).filter(l => matchesUserTypes(l, userTypes)).filter(l => !violatesVeto(user, meta, l)).map(l => scoreLeader(l));
    baseCandidates = relaxedTypeSameVeto.sort((a,b)=>a.score-b.score);
  }

  let unlockApplied = applyUnlockWindow(user, baseCandidates);
  let results = unlockApplied.candidates.slice().sort((a,b)=>a.score-b.score);

  if(results.length === 0){
    results = leaders.filter(l => l.quadrant === lockedQuadrant).map(l=>scoreLeader(l, 4.0)).sort((a,b)=>a.score-b.score);
  }

  const best = results[0].leader;

  document.getElementById("resultWrap").style.display = "block";
  document.getElementById("restartBtn").style.display = "block";
  document.getElementById("leaderName").textContent = best.name;
  document.getElementById("leaderBio").textContent = best.bio;
  document.getElementById("leaderSummary").textContent = best.summary;
  document.getElementById("whyText").textContent = whyMatched(user, best, meta);
  document.getElementById("shareText").textContent = `我测出来最像 ${best.name} —— ${best.bio}。你也来测测看？`;

  document.getElementById("leaderBadges").innerHTML = `<span class="pill">唯一结果匹配</span><span class="pill">多维原型比对</span>`;
  const axes = [ ["权力控制", best.vec.power], ["理性规划", best.vec.logic], ["对抗倾向", best.vec.conflict], ["情绪动员", best.vec.emotion], ["制度秩序", best.vec.order], ["意识形态", best.vec.ideology], ["群众动员", best.vec.mobilization], ["强制力量", best.vec.force], ["发展导向", best.vec.development] ];
  document.getElementById("leaderAxes").innerHTML = axes.map(([n,v])=>`<span class="pill">${n} ${v}</span>`).join("");

  const top = document.getElementById("topMatches"); top.innerHTML = "";
  results.slice(1,3).forEach((r, i)=>{
    const d = document.createElement("div"); d.className = "mini-card";
    d.innerHTML = `<strong>#${i+2} ${r.leader.name}</strong><p style="margin:8px 0 0;color:var(--muted)">${r.leader.bio}</p>`;
    top.appendChild(d);
  });

  const img = document.getElementById("leaderImg");
  setLocalImage(img, best.slug, best.name);
  window.scrollTo({top:document.getElementById("resultWrap").offsetTop - 16, behavior:"smooth"});
}

document.getElementById("prevBtn").addEventListener("click", ()=>{
  if(phase === "quadrant"){ if(currentIndex > 0){ currentIndex -= 1; renderCurrentQuestion(); } }
  else{ if(currentIndex > 0){ currentIndex -= 1; renderCurrentQuestion(); } else { phase = "quadrant"; currentIndex = quadrantQuestions.length - 1; renderCurrentQuestion(); } }
  window.scrollTo({top:0, behavior:"smooth"});
});

document.getElementById("nextBtn").addEventListener("click", ()=>{
  if(phase === "quadrant"){
    if(currentIndex < quadrantQuestions.length - 1){ currentIndex += 1; renderCurrentQuestion(); }
    else{ lockedQuadrant = determineQuadrant(); phase = "main"; currentIndex = 0; renderCurrentQuestion(); }
    window.scrollTo({top:0, behavior:"smooth"});
  } else {
    if(currentIndex < questions.length - 1){ currentIndex += 1; renderCurrentQuestion(); window.scrollTo({top:0, behavior:"smooth"}); }
    else{ renderResult(); }
  }
});

document.getElementById("resetBtn").addEventListener("click", ()=>{ initState(); renderCurrentQuestion(); document.getElementById("resultWrap").style.display = "none"; document.getElementById("restartBtn").style.display = "none"; window.scrollTo({top:0, behavior:"smooth"}); });
document.getElementById("restartBtn").addEventListener("click", ()=>{ initState(); renderCurrentQuestion(); document.getElementById("resultWrap").style.display = "none"; document.getElementById("restartBtn").style.display = "none"; window.scrollTo({top:0, behavior:"smooth"}); });

document.getElementById("restartBtn").style.display = "none";
renderCurrentQuestion();
</script>
</body></html>
