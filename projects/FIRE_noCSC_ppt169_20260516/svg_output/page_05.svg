<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="60" y="52" font-family="Segoe UI, system-ui, sans-serif" font-size="28" font-weight="700" fill="#0C4A6E">Preliminary Data</text>
  <text x="60" y="78" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#64748B">Four Key Findings After Training</text>
  <line x1="60" y1="95" x2="140" y2="95" stroke="#7DD3FC" stroke-width="3"/>

  <!-- 2x2 Grid -->
  <!-- Top-left -->
  <rect x="60" y="120" width="560" height="260" rx="12" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1"/>
  <text x="88" y="152" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0369A1">1. Anticipatory Signal</text>
  <text x="88" y="180" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1A1A2E">Preparatory activity 200–300 ms before movement onset</text>
  <text x="88" y="204" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748B">Exclusive to closed-loop condition</text>
  <text x="88" y="232" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1A1A2E">Builds progressively: Expert > Intermediate > Beginner</text>
  <text x="88" y="270" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748B">→ Correlate of sensorimotor learning, not a fixed property</text>
  <text x="88" y="310" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748B">Absent in open-loop sound and passive movement conditions</text>
  <text x="88" y="348" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748B">Signal strength scales with weeks of closed-loop exposure</text>

  <!-- Top-right -->
  <rect x="660" y="120" width="560" height="260" rx="12" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1"/>
  <text x="688" y="152" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0369A1">2. Kinematic Encoding</text>
  <text x="688" y="180" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1A1A2E">A1 firing rate systematically modulated by head speed</text>
  <text x="688" y="208" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748B">Population-level decoding of head speed from A1 activity</text>
  <text x="688" y="240" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0369A1">Decoding accuracy: Closed-loop > Open-loop</text>
  <text x="688" y="268" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748B">Wilcoxon test, p &lt; 0.001</text>
  <text x="688" y="310" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748B">→ A1 encodes movement parameters as a consequence</text>
  <text x="688" y="340" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748B">of the learned sensorimotor contingency</text>

  <!-- Bottom-left -->
  <rect x="60" y="410" width="560" height="260" rx="12" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1"/>
  <text x="88" y="442" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0369A1">3. Sharpened Frequency Representations</text>
  <text x="88" y="472" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1A1A2E">Sensorimotor experience sculpts sensory tuning in A1</text>
  <text x="88" y="506" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748B">→ Experience-dependent plasticity in primary sensory cortex</text>
  <text x="88" y="550" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748B">Frequency discrimination improves with closed-loop training</text>
  <text x="88" y="580" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748B">Receptive fields narrow around behaviorally relevant frequencies</text>

  <!-- Bottom-right -->
  <rect x="660" y="410" width="560" height="260" rx="12" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1"/>
  <text x="688" y="442" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0369A1">4. Strengthened A1-PMC Coupling</text>
  <text x="688" y="472" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1A1A2E">Noise correlations between A1 &amp; Premotor Cortex:</text>
  <text x="688" y="506" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" fill="#0369A1">Closed-loop > Open-loop (p &lt; 0.001)</text>
  <text x="688" y="540" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748B">Increases progressively with learning stage</text>
  <text x="688" y="580" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748B">→ Consolidation of premotor-to-auditory</text>
  <text x="688" y="608" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#64748B">functional connectivity underlying learned predictions</text>

  <text x="1220" y="700" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#94A3B8">5</text>
</svg>