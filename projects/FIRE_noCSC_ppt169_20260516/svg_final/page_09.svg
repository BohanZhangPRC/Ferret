<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF" />
  <text x="60" y="52" font-family="Segoe UI, system-ui, sans-serif" font-size="28" font-weight="700" fill="#0C4A6E">Contribution to SDGs &amp; Planetary Health</text>
  <line x1="60" y1="68" x2="140" y2="68" stroke="#7DD3FC" stroke-width="3" />

  
  <path fill="#E0F2FE" d="M70,90 H310 A10,10 0 0 1 320,100 V110 A10,10 0 0 1 310,120 H70 A10,10 0 0 1 60,110 V100 A10,10 0 0 1 70,90 Z" />
  <text x="190" y="110" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0369A1">SDG 3 · Good Health</text>
  <path fill="#E0F2FE" d="M345,90 H525 A10,10 0 0 1 535,100 V110 A10,10 0 0 1 525,120 H345 A10,10 0 0 1 335,110 V100 A10,10 0 0 1 345,90 Z" />
  <text x="435" y="110" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0369A1">SDG 4 · Education</text>
  <path fill="#E0F2FE" d="M560,90 H770 A10,10 0 0 1 780,100 V110 A10,10 0 0 1 770,120 H560 A10,10 0 0 1 550,110 V100 A10,10 0 0 1 560,90 Z" />
  <text x="665" y="110" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0369A1">SDG 9 · Innovation</text>
  <path fill="#E0F2FE" d="M805,90 H1015 A10,10 0 0 1 1025,100 V110 A10,10 0 0 1 1015,120 H805 A10,10 0 0 1 795,110 V100 A10,10 0 0 1 805,90 Z" />
  <text x="910" y="110" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#0369A1">SDG 17 · Partnerships</text>

  
  <path fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1" d="M72,140 H608 A12,12 0 0 1 620,152 V368 A12,12 0 0 1 608,380 H72 A12,12 0 0 1 60,368 V152 A12,12 0 0 1 72,140 Z" />
  <text x="88" y="172" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0369A1">SDG 3 — Good Health &amp; Well-Being</text>
  <text x="88" y="204" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1A1A2E">Speech &amp; language disorders share a common mechanistic root: breakdown in</text>
  <text x="88" y="226" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1A1A2E">the auditory-motor circuits that predict, monitor, and correct self-generated sounds</text>
  <text x="88" y="258" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1A1A2E">BCI design depends on understanding how sensory cortices encode movement</text>
  <text x="88" y="290" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0369A1">→ Implications for disorders affecting hundreds of millions globally</text>

  <path fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" d="M72,395 H608 A12,12 0 0 1 620,407 V483 A12,12 0 0 1 608,495 H72 A12,12 0 0 1 60,483 V407 A12,12 0 0 1 72,395 Z" />
  <text x="88" y="427" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0369A1">SDG 4 · 9 · 17</text>
  <text x="88" y="452" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1A1A2E">Open methods &amp; datasets → global scientific capacity building</text>
  <text x="88" y="476" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1A1A2E">Computational frameworks → transferable to international brain initiatives &amp; BCI R&amp;D</text>

  
  <path fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1" d="M672,140 H1208 A12,12 0 0 1 1220,152 V368 A12,12 0 0 1 1208,380 H672 A12,12 0 0 1 660,368 V152 A12,12 0 0 1 672,140 Z" />
  <text x="688" y="172" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0369A1">Planetary Health Perspective</text>
  <text x="688" y="204" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1A1A2E">Interdisciplinary research as a template: bridging single-neuron mechanisms</text>
  <text x="688" y="226" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1A1A2E">with complex behavioral phenomena — same integrative thinking needed for</text>
  <text x="688" y="248" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1A1A2E">planetary challenges</text>
  <text x="688" y="280" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1A1A2E">Global neurological disorder burden demands cross-border scientific collaboration</text>
  <text x="688" y="312" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1A1A2E">Ethical AI for health: biological forward/inverse models inspire interpretable</text>
  <text x="688" y="334" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1A1A2E">neural network architectures for clinical BCI applications</text>

  <path fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" d="M672,395 H1208 A12,12 0 0 1 1220,407 V548 A12,12 0 0 1 1208,560 H672 A12,12 0 0 1 660,548 V407 A12,12 0 0 1 672,395 Z" />
  <text x="688" y="427" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0369A1">Responsible Research &amp; Post-2030</text>
  <text x="688" y="458" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1A1A2E">Best case: mechanistic knowledge informing neuroprosthetic devices</text>
  <text x="688" y="482" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1A1A2E">Key risk: over-interpretation of animal findings → mitigated by precise language</text>
  <text x="688" y="508" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748B">Post-2030: protect fundamental research as a global commons</text>
  <text x="688" y="536" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#64748B">Governance: analysis pipelines publicly released under FAIR principles</text>

  <text x="1220" y="700" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#94A3B8">9</text>
</svg>